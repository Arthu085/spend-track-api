services:
  postgres:
    image: postgres:16-alpine
    container_name: spend-track-db
    env_file: .env
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-spend_track}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - spend-track-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spend-track-api
    user: root
    command: sh -c "npm run migration:run && npm run seed && npm run start:dev"
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
    ports:
      - '${PORT:-3000}:${PORT:-3000}'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - spend-track-network

volumes:
  postgres_data:
    driver: local

networks:
  spend-track-network:
    driver: bridge
