# Production stack for a single host. Copied to DEPLOY_PATH with the rest of deploy/ and run from
# there; values come from DEPLOY_PATH/.env (interpolation only) and DEPLOY_PATH/api.env (API runtime).
# docs/deployment.md describes every variable and command.

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '5'

services:
  api:
    image: ${API_IMAGE:?API_IMAGE must be set in .env; deploy.sh writes it}
    restart: unless-stopped
    stop_grace_period: 30s
    env_file:
      - api.env
    environment:
      NODE_ENV: production
      PORT: 3000
      TRUST_PROXY: 1
      APP_WEB_URL: https://${APP_DOMAIN:?APP_DOMAIN must be set in .env}
      CORS_ORIGINS: https://${APP_DOMAIN}
      COOKIE_SECURE: 'true'
      COOKIE_DOMAIN: ''
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:?DB_NAME must be set in .env}
      DB_USER: ${DB_USER:?DB_USER must be set in .env}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      DB_SSL: 'false'
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      APP_DB_NAME: ${DB_NAME}
      APP_DB_USER: ${DB_USER}
      APP_DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d postgres']
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging

  caddy:
    image: ${CADDY_IMAGE:-caddy:2.10-alpine}
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL must be set in .env}
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
      - '${HTTPS_PORT:-443}:443/udp'
    volumes:
      - ./caddy:/etc/caddy:ro
      - ./frontend:/srv/frontend:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    logging: *logging

  # Temporary SMTP sink: set MAIL_HOST=mailpit and COMPOSE_PROFILES=mail. The web UI is published on
  # the host's loopback interface only; open it through an SSH tunnel.
  mailpit:
    image: ${MAILPIT_IMAGE:-axllent/mailpit:v1.29}
    profiles:
      - mail
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 500
    ports:
      - '127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025'
    logging: *logging

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
