name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Pull requests share one group per PR ref, so a new commit cancels the outdated run.
# Each push to main gets its own group (run id), so no push replaces another pending one.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (with coverage threshold)
        run: npm run test:cov

      # Testcontainers provisions its own ephemeral Postgres for both suites;
      # the runner's Docker daemon is the only requirement.
      - name: Integration tests
        run: npm run test:integration

      - name: E2E tests
        run: npm run test:e2e

      - name: Build
        run: npm run build

  production-image:
    name: Production image smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Built and loaded into the runner's Docker daemon only; nothing is pushed.
      - name: Build prod target
        uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          tags: api:ci-${{ github.sha }}
          load: true
          push: false
          cache-from: type=gha,scope=prod
          cache-to: type=gha,scope=prod,mode=max

      # Disposable PostgreSQL and Mailpit, secrets generated per run.
      - name: Smoke test
        run: scripts/smoke-test-prod-image.sh api:ci-${{ github.sha }}
